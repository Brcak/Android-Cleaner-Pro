name: Windows .NET Build
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build-dotnet-windows.ps1'
      - '.github/workflows/windows-dotnet.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build portable Windows EXE with embedded Google ADB
        shell: pwsh
        run: |
          ./build-dotnet-windows.ps1 *>&1 | Tee-Object -FilePath build-output.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload build diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidCleanerPro-Build-Log
          path: build-output.log
          if-no-files-found: warn
      - name: Upload portable ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidCleanerPro-Portable-win-x64
          path: dist/AndroidCleanerPro-Portable-win-x64.zip
          if-no-files-found: error
