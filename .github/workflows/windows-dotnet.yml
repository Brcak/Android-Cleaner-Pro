name: Windows .NET Build
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'installer/**'
      - 'build-dotnet-windows.ps1'
      - '.github/workflows/windows-dotnet.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-cleaner-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Compile Windows desktop application
        shell: pwsh
        run: ./build-dotnet-windows.ps1
      - name: Bundle official Google Android Platform Tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "platform-tools.zip"
          Invoke-WebRequest "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath "dist/Windows" -Force
          if (-not (Test-Path "dist/Windows/platform-tools/adb.exe")) { throw "ADB bundle missing" }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Setup.exe installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler "/DAppVersion=0.3.$env:GITHUB_RUN_NUMBER" "installer\AndroidCleanerPro.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
      - name: Publish versioned GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.3.$env:GITHUB_RUN_NUMBER"
          gh release create $tag "dist/Installer/AndroidCleanerPro-Setup.exe" --title "Android Cleaner Pro $tag" --notes "Windows installer. Update installs over the existing version." --latest
      - name: Upload Windows Setup installer
        uses: actions/upload-artifact@v5
        with:
          name: AndroidCleanerPro-Setup-Windows
          path: dist/Installer/AndroidCleanerPro-Setup.exe
          if-no-files-found: error
      - name: Upload Windows application files
        uses: actions/upload-artifact@v5
        with:
          name: AndroidCleanerPro-Windows
          path: dist/Windows/
          if-no-files-found: error
