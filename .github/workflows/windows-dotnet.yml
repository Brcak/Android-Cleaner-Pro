name: Windows .NET Build
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build-dotnet-windows.ps1'
      - '.github/workflows/windows-dotnet.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile Windows desktop application
        shell: pwsh
        run: |
          ./build-dotnet-windows.ps1
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: AndroidCleanerPro-Windows
          path: dist/Windows/
          if-no-files-found: error
