name: Windows .NET Build
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'installer/**'
      - 'build-dotnet-windows.ps1'
      - '.github/workflows/windows-dotnet.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Compile Windows desktop application
        shell: pwsh
        run: ./build-dotnet-windows.ps1
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Setup.exe installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler "installer\AndroidCleanerPro.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
      - name: Upload Windows Setup installer
        uses: actions/upload-artifact@v5
        with:
          name: AndroidCleanerPro-Setup-Windows
          path: dist/Installer/AndroidCleanerPro-Setup.exe
          if-no-files-found: error
      - name: Upload Windows application files
        uses: actions/upload-artifact@v5
        with:
          name: AndroidCleanerPro-Windows
          path: dist/Windows/
          if-no-files-found: error
